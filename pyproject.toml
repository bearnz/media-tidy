[project]
name = "media-tidy"
version = "0.1.0"
description = "Tidies Plex media under N:\\.plex into TV/Movies naming conventions, with dry-run plans, quarantine and undo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
media-tidy = "media_tidy:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
